  {id:'S03',stage:'S',kind:'五感真實',q:'學游泳的經驗中，哪種描寫最應注意「符合真實」？',options:['我確實聽到教練的口令。','我確實看見水花。','我假裝看見海豚在池裡游泳。','我感覺池水冰涼。'],answer:2,why:['聽覺可取自真實經驗。','視覺可取自真實經驗。','若沒有真的發生，不應冒充親身經驗。','觸覺可取自真實經驗。']},
  {id:'S04',stage:'S',kind:'視覺選材',q:'要描寫「成功前後的改變」，哪一組畫面最好？',options:['昨天和今天的日期。','池水和泳帽的顏色。','先抓住池邊不敢放手，後來鬆手後向前移動。','爸爸和媽媽都很忙。'],answer:2,why:['日期無法顯示動作進步。','顏色不一定呈現轉變。','兩個相對照的動作清楚表現突破。','不是事件前後的畫面。']},
  {id:'P01',stage:'P',kind:'事件分類',q:'「爸爸帶我到游泳池」應放在哪個段落？',options:['起因','遇到困難','突破','結果'],answer:0,why:['交代人物、地點與故事開始，屬起因。','尚未描述困難。','尚未呈現如何突破。','不是最後的收穫。']},
  {id:'P02',stage:'P',kind:'故事順序',q:'哪一種故事順序最完整？',options:['成功→出發→練習→困難','出發→困難→練習→成功','困難→成功→出發→練習','練習→出發→成功→困難'],answer:1,why:['一般敘事若無刻意倒敘，先後關係混亂。','符合起因、困難、突破與結果。','起因置於最後，難以理解。','練習通常不應放在出發前。']},
  {id:'P03',stage:'P',kind:'材料選擇',q:'要寫「最緊張的一刻」，哪個素材最有幫助？',options:['泳池附近商店的價格','一年有十二個月','第一次放手後身體往下沉','我去年生日收到禮物'],answer:2,why:['與緊張瞬間關係不大。','與故事無關。','是能描寫動作與感受的關鍵事件。','與學游泳的過程無關。']},
  {id:'P04',stage:'P',kind:'段落聚焦',q:'第三段「努力與突破」最需要哪項材料？',options:['我每天吃的早餐','我調整呼吸並再次練習打水','泳池的開放時間','我最愛的卡通'],answer:1,why:['與如何努力缺少連結。','描寫具體方法與重新嘗試。','是背景資訊，不是努力。','偏離主題。']},
  {id:'E01',stage:'E',kind:'句子升級',q:'哪句比「我很高興」更具體？',options:['我非常非常高興。','我高興到很高興。','游到池邊時，我忍不住舉起手，朝爸爸笑了。','高興是很重要的。'],answer:2,why:['只是加強程度，畫面仍不清楚。','重複形容詞，沒有新細節。','用動作和表情表達成功的喜悅。','解說情緒概念，非故事描寫。']},
  {id:'E02',stage:'E',kind:'比喻適切',q:'哪句比喻較貼合初學者下沉的感受？',options:['我的身體像石頭一樣往下沉。','我像太陽一樣下沉到教室。','泳帽像學校的考卷。','爸爸的聲音像鞋帶。'],answer:0,why:['用石頭下沉形容身體失去浮力的感受，容易理解。','意象和場景不相符。','缺少清楚共同特徵。','比喻缺少可理解的關聯。']},
  {id:'E03',stage:'E',kind:'人物對話',q:'哪句能讓爸爸的鼓勵更真實？',options:['爸爸是很好的人。','爸爸說：「先慢慢吐氣，我在旁邊陪你。」','有人曾說過很多話。','我知道大家都很努力。'],answer:1,why:['沒有呈現鼓勵內容。','直接引語呈現具體指導與支持。','內容模糊，無法讓讀者理解。','不聚焦爸爸的言語。']},
  {id:'E04',stage:'E',kind:'演說口語',q:'把作文改成演說，哪個開場較自然？',options:['茲就本人游泳學習經過報告如下。','那一天，我站在泳池邊，腳怎麼也不敢往下踩。你也曾這麼害怕嗎？','綜觀上述，故有心得。','下面有四個段落，各是八十字。'],answer:1,why:['過度書面，口語聽來生硬。','有畫面、有聽眾感，適合口語分享。','像公文結尾而非開場。','介紹字數無法吸引聽眾。']},
  {id:'K01',stage:'K',kind:'自主修改',q:'AI說「第二段不夠具體」時，最好的做法是什麼？',options:['整篇直接貼上AI改寫結果','全部刪掉不寫','回想自己看見的動作與聲音，補寫一兩句','隨便加上十個成語'],answer:2,why:['會失去學生自己的聲音。','無法幫助進步。','回到真實經驗，自行增加具體細節。','成語多不代表畫面清楚。']},
  {id:'K02',stage:'K',kind:'修改比較',q:'哪一項最能證明自己真的學會修改？',options:['只記下AI給的分數','能指出自己修改了哪一句，並說明原因','文章變長就一定比較好','所有句子都換成成語'],answer:1,why:['分數不能代替修改歷程。','有前後版本及修改理由，是可觀察的成長證據。','長度不一定等於品質。','過多成語反而可能影響自然表達。']},
  {id:'K03',stage:'K',kind:'演說表達',q:'演說最重要的是哪一件事？',options:['每句都用最大音量','眼睛只看地板','用自然速度說清楚，重要地方適度停頓','把文章每個標點都唸出來'],answer:2,why:['過大的音量可能缺乏變化。','不利於與聽眾交流。','兼顧理解、自然與重點。','標點應轉為停頓，不必唸名稱。']},
  {id:'K04',stage:'K',kind:'檢核成果',q:'完成這個模組，哪一組作品最能呈現進步？',options:['只有一個漂亮標題','只有題目答對率','只有別人寫的範文','心智圖、初稿、修訂稿、修改理由與口語自評'],answer:3,why:['無法看到完整學習歷程。','不能證明真實寫作能力。','不是學生的自主產出。','能記錄觀察、構思、寫作和發表的改進。']}

function nav(id){page=id;selected=-1;revealed=false;window.scrollTo({top:0,behavior:'smooth'});render()};function pct(){return Math.round(Object.keys(data.completed).filter(k=>data.completed[k]).length/5*100)}
function render(){el('hero').textContent=`${M.grade}｜${M.island}｜${M.title}`;el('menu').innerHTML=PAGES.map(([id,t])=>`<button class="nav ${page===id?'active':''}" onclick="nav('${id}')">${t}</button>`).join('');el('screen').innerHTML=({home:home,S:see,P:plan,E:express,A:coach,K:keep,quiz:quiz,export:portfolio}[page])();}
function home(){return `<h2>${esc(M.title)}｜五關自學旅程</h2><p>${esc(M.subtitle)}</p><div class="line"><div class="fill" style="width:${pct()}%"></div></div><p class="muted">SPEAK完成度 ${pct()}%（須自己勾選各關完成；小測驗另計）</p><div class="steps">${['S 觀察','P 心智圖','E 寫說','A AI教練引導','K 精進發表'].map(x=>`<span class="step">${x}</span>`).join('')}</div><h3>這一關要練習什麼？</h3>${M.objectives.map(s=>`<div class="card">✓ ${esc(s)}</div>`).join('')}<div class="actions"><button class="primary" onclick="nav('S')">從 S 視覺觀察開始 →</button><button onclick="nav('quiz')">先挑戰16題練習</button></div><div class="coach">🔎 學習守則：先自己想、自己寫，再接受提示；視覺優先，其他感官必須符合真實經驗。</div>`}
function complete(id){data.completed[id]=true;save();render()};function field(group,index,v){data[group][index]=v;save()};function textField(key,v){data[key]=v;save()};
function fields(questions,group,arr){return `<div class="grid">${questions.map((q,i)=>`<div><label>${i+1}. ${esc(Array.isArray(q)?q[0]:q)}</label>${Array.isArray(q)?`<div class="muted">${esc(q[1])}</div>`:''}<textarea aria-label="${esc(Array.isArray(q)?q[0]:q)}" oninput="field('${group}',${i},this.value)">${esc(arr[i]||'')}</textarea></div>`).join('')}</div>`}
function see(){return `<h2>S｜看見故事的畫面</h2><p>先回想自己真正見過的畫面。每題寫一兩句就好。</p>${fields(M.observation,'observations',data.observations)}<h3>五感詞語參考站</h3><div class="grid">${Object.entries(M.senses).map(([k,a])=>`<div class="card soft"><b>${esc(k)}</b><p class="small">${a.map(esc).join('、')}</p></div>`).join('')}</div><div class="actions"><button onclick="nav('quiz')">去做視覺練習題</button><button class="primary" onclick="complete('S')">我完成觀察 → P</button></div><p id="saveState" class="muted"></p>`}
function plan(){return `<h2>P｜我的故事心智圖</h2><p class="muted">先蒐集關鍵語詞，不必急著寫完整句子。</p>${fields(M.mindmap,'mind',data.mind)}<div class="card soft"><b>四段故事地圖</b><p>起因 → 遇到困難 → 努力突破 → 結果與成長</p></div><div class="actions"><button onclick="nav('quiz')">事件順序練習</button><button class="primary" onclick="complete('P')">我完成構思 → E</button></div><p id="saveState" class="muted"></p>`}
function express(){return `<h2>E｜四段作文與口說</h2><p>目標約400字，可依自己的真實經驗調整，不用刻意湊字。</p>${M.paragraph.map((p,i)=>`<div class="card"><h3>${i+1}. ${esc(p.name)} <span class="badge">參考 ${p.target} 字</span></h3><div class="muted">${esc(p.tip)}</div><p class="small">💡 ${esc(p.prompt)}</p><textarea style="min-height:145px" aria-label="${esc(p.name)}" oninput="field('draft',${i},this.value);updateCount(${i})">${esc(data.draft[i]||'')}</textarea><div class="small muted" id="count${i}">${length(data.draft[i])} 字</div></div>`).join('')}<p><b>初稿總字數：</b>${data.draft.reduce((n,s)=>n+length(s),0)} 字（重新進入本頁會更新總數）</p><div class="actions"><button onclick="nav('quiz')">句子與口語小測驗</button><button class="primary" onclick="complete('E')">我完成初稿 → A</button></div><p id="saveState" class="muted"></p>`}
function updateCount(i){el('count'+i).textContent=length(data.draft[i])+' 字'}
function coachPrompt(){const drafts=data.draft.map((x,i)=>({i,t:x.trim()})).filter(x=>x.t);if(!drafts.length)return '你還沒有寫初稿。先寫下自己的故事，AI教練才能幫你發現值得補充的地方。';if(!data.mind[5])return '在最困難的一刻，你的手腳做了什麼？眼前看見什麼？先寫下真正發生的一件事。';if(!data.draft[1]||length(data.draft[1])<65)return '第二段請先聚焦一個困難：當時你看到什麼畫面？可以補上一個具體動作嗎？';if(!data.draft[2]||length(data.draft[2])<65)return '第三段你有寫到再次嘗試的具體方法嗎？想想自己如何調整呼吸、手或腳的動作。';if(!data.draft[3]||length(data.draft[3])<40)return '最後一段除了「好開心」，你學會了什麼？試著選一種結尾方向。';return '你已寫出完整四段。挑一處最重要的畫面，檢查有沒有顏色、位置、動作或前後變化，再用自己的話修改。'}
function coach(){return `<h2>A｜AI寫作教練</h2><div class="banner">本示範版採用<b>本機規則式教練</b>，不連接付費生成式AI，也不會傳送你的作文到外部服務；可以先驗證教學流程。</div><div class="coach"><b>教練問你：</b><p>${esc(coachPrompt())}</p></div><h3>六種結尾思考方向</h3><div class="grid">${M.endings.map(([k,t])=>`<div class="card soft"><b>${esc(k)}</b><p class="small">${esc(t)}</p></div>`).join('')}</div><h3>AI教練的固定規則</h3><p>找出一處優點 → 提出一個具體追問 → 孩子自行修改 → 說明修改原因。</p><div class="actions"><button class="primary" onclick="complete('A')">我看過教練提示 → K</button></div>`}
function keep(){return `<h2>K｜修改、演說與發表</h2><p class="muted">請回看 E 的初稿，在下面寫下修改後的句段；保留原稿，不要覆蓋，才能看到成長。</p>${M.paragraph.map((p,i)=>`<div class="card"><label>修訂稿第 ${i+1} 段｜${esc(p.name)}</label><textarea oninput="field('revised',${i},this.value)">${esc(data.revised[i]||'')}</textarea></div>`).join('')}<label>我修改了什麼？為什麼？</label><textarea oninput="textField('revisionReason',this.value)">${esc(data.revisionReason||'')}</textarea><h3>1～2分鐘演說小教室</h3>${M.speech.map(s=>`<div class="card soft">🎤 ${esc(s)}</div>`).join('')}<label>我的演說提綱（只寫關鍵字）</label><textarea oninput="textField('speech',this.value)">${esc(data.speech||'')}</textarea><h3>自我檢查</h3>${M.rubric.map((s,i)=>`<label class="card"><input style="width:auto" type="checkbox" ${data.checks.includes(i)?'checked':''} onchange="check(${i},this.checked)"> ${esc(s)}</label>`).join('')}<label>我的學習反思</label><textarea oninput="textField('reflection',this.value)">${esc(data.reflection||'')}</textarea><div class="actions"><button class="primary" onclick="complete('K')">完成模組！看成長護照 →</button></div><p id="saveState" class="muted"></p>`}
function check(i,val){data.checks=val?[...new Set([...data.checks,i])]:data.checks.filter(x=>x!==i);save()}
function getQs(){return quizStage==='all'?M.questions:M.questions.filter(q=>q.stage===quizStage)}
function quiz(){const qs=getQs();if(qi>=qs.length)qi=0;const q=qs[qi],record=data.answers[q.id];return `<h2>🧩 技能練習｜逐項詳解</h2><p>每道題目都有四個選項的解析。先選答案，再點「查看詳解」。</p><div class="actions">${['all','S','P','E','K'].map(st=>`<button ${quizStage===st?'class="primary"':''} onclick="quizStage='${st}';qi=0;selected=-1;revealed=false;render()">${st==='all'?'全部16題':st+'階段'}</button>`).join('')}</div><div class="card"><span class="pill">第 ${qi+1}／${qs.length} 題 · ${esc(q.kind)}</span><h3>${esc(q.q)}</h3>${q.options.map((o,i)=>`<button class="choice ${selected===i?'sel':''} ${revealed&&i===q.answer?'good':''} ${revealed&&i===selected&&i!==q.answer?'bad':''}" onclick="choose(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}${revealed?`<div class="result"><b>${selected===q.answer?'✓ 答對了！':'再想一次：正確答案 '+ 'ABCD'[q.answer]}</b></div>${q.why.map((x,i)=>`<div class="expl"><b>${'ABCD'[i]} ${i===q.answer?'（正解）':''}</b>：${esc(x)}</div>`).join('')}`:''}<div class="actions"><button ${selected<0||revealed?'disabled':''} onclick="reveal()">查看逐項詳解</button><button onclick="nextQ()">${qi===qs.length-1?'回到第一題':'下一題 →'}</button></div></div><p class="muted">已練習 ${Object.keys(data.answers).length} / ${M.questions.length} 題；答錯可以再次嘗試。每題保存最近一次作答。</p><button onclick="nav('home')">回學習首頁</button>`}
function choose(i){if(revealed)return;selected=i;render()};function reveal(){if(selected<0)return;const q=getQs()[qi];revealed=true;data.answers[q.id]={selected,correct:selected===q.answer};save();render()};function nextQ(){qi=(qi+1)%getQs().length;selected=-1;revealed=false;render()}
function report(){return [`# ${M.title}｜學習護照`, `模組：${M.id}／${M.grade}`,`SPEAK完成：${Object.keys(data.completed).filter(k=>data.completed[k]).join(', ')}`,'\n【觀察紀錄】',...M.observation.map((x,i)=>`${x} ${data.observations[i]||''}`),'\n【心智圖】',...M.mindmap.map((x,i)=>`${x[0]}：${data.mind[i]||''}`),'\n【初稿】',...data.draft.map((x,i)=>`第${i+1}段：\n${x}`),'\n【修訂稿】',...data.revised.map((x,i)=>`第${i+1}段：\n${x}`),'\n【修改理由】',data.revisionReason,'\n【演說提綱】',data.speech,'\n【反思】',data.reflection].join('\n')}
function download(){const blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=M.id+'_學習護照.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function portfolio(){const answered=Object.values(data.answers),correct=answered.filter(a=>a.correct).length;return `<h2>📚 我的成長護照</h2><div class="grid"><div class="card soft"><b>SPEAK完成率</b><h2>${pct()}%</h2></div><div class="card soft"><b>最近一次答對</b><h2>${correct} / ${answered.length}</h2></div><div class="card soft"><b>初稿字數</b><h2>${data.draft.reduce((n,t)=>n+length(t),0)}</h2></div><div class="card soft"><b>修訂稿字數</b><h2>${data.revised.reduce((n,t)=>n+length(t),0)}</h2></div></div><p>保存紀錄不等於教師評定過關；文章與演說仍需要自評或教師依規準檢核。</p><div class="actions"><button class="primary" onclick="download()">⬇ 匯出我的學習成果（文字檔）</button><button onclick="copyReport()">複製到剪貼簿</button></div><p id="reportState" class="muted"></p><details class="card"><summary>清除本機練習資料</summary><p>此操作不能復原，請先匯出成果。</p><button onclick="resetAll()">確定清除</button></details>`}
async function copyReport(){try{await navigator.clipboard.writeText(report());el('reportState').textContent='✓ 已複製'}catch(e){el('reportState').textContent='此瀏覽器無法直接複製，請用下載文字檔'}}
function resetAll(){if(confirm('確定刪除本裝置上此模組的所有學習資料？')){localStorage.removeItem(KEY);data=empty();nav('home')}}
render();
</script><script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Offline setup unavailable', error));}</script></body></html>
